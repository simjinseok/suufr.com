version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 24
    commands:
      - corepack enable
      - corepack prepare pnpm@10 --activate

  pre_build:
    commands:
      - node --version
      - pnpm --version
      - pnpm install --frozen-lockfile --config.node-linker=hoisted

  build:
    commands:
      - pnpm turbo build --filter=web

  post_build:
    commands:
      - cd apps/web
      - cp -r .next/static .next/standalone/apps/web/.next/static
      - cp -r public .next/standalone/apps/web/public 2>/dev/null || true
      - cp -r .ebextensions .next/standalone/
      - cp Procfile .next/standalone/

artifacts:
  base-directory: apps/web/.next/standalone
  files:
    - '**/*'
  discard-paths: no

cache:
  paths:
    - node_modules/**/*
    - apps/web/node_modules/**/*
    - apps/web/.next/cache/**/*
    - /root/.local/share/pnpm/store/**/*
