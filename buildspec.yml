version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - corepack enable
      - corepack prepare pnpm@10 --activate

  pre_build:
    commands:
      - node --version
      - pnpm --version
      - pnpm install --frozen-lockfile

  build:
    commands:
      - pnpm build

  post_build:
    commands:
      - echo "Build completed on $(date)"

artifacts:
  files:
    - .next/standalone/**/*
    - .platform/**/*
    - Procfile
  discard-paths: no

cache:
  paths:
    - node_modules/**/*
    - .next/cache/**/*
    - /root/.local/share/pnpm/store/**/*
