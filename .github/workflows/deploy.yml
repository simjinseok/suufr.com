name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  test:
    name: Test
    # 모든 잡은 arm64 러너를 쓴다. Coolify 서버가 ARM 이라 이미지를 네이티브로 빌드해야 하고,
    # 테스트도 운영과 같은 아키텍처에서 돌리기 위해서다 (공개 저장소는 무료).
    runs-on: ubuntu-26.04-arm
    outputs:
      apps: ${{ steps.affected.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
        with:
          # turbo --affected 가 base 커밋(github.event.before)까지 diff 할 수 있어야 한다
          fetch-depth: 0
      # pnpm 버전은 루트 package.json 의 packageManager 가 결정한다 (version 입력을 주면 충돌로 실패)
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      # web 테스트가 api 소스를 import 하므로 필터 없이 전체 설치한다
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api prisma:generate
      - run: pnpm --filter api test:run
      - run: pnpm --filter web test:run

      # 빌드 대상 선정: turbo 의존성 그래프로 base..HEAD 사이에 영향받은 패키지만 고른다.
      # - apps/*, packages/* 변경은 그래프를 따라 전파된다 (packages/* 가 바뀌면 web/api 둘 다)
      # - pnpm-lock.yaml 은 의미 단위로 비교된다 (실제 의존성 버전이 바뀐 패키지만)
      # - 루트 파일은 turbo.json 의 globalDependencies 가 결정한다
      # - base 를 찾지 못하면(새 브랜치, force push) turbo 가 경고 후 전체를 반환한다
      # - 수동 실행은 항상 둘 다 빌드한다
      # - PR 은 base 브랜치 커밋과 비교한다 (github.event.before 가 없다)
      - name: Detect affected apps
        id: affected
        env:
          TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TURBO_SCM_HEAD: ${{ github.sha }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$MANUAL" = "true" ]; then
            apps='["web","api"]'
          else
            apps=$(pnpm exec turbo run build --affected --dry-run=json | node -e '
              const raw = require("fs").readFileSync(0, "utf8");
              const json = JSON.parse(raw.slice(raw.indexOf("{")));
              const affected = new Set(json.packages);
              process.stdout.write(JSON.stringify(["web", "api"].filter(a => affected.has(a))));
            ')
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "build targets: $apps"

  # 빌드와 푸시는 잡을 나눈다. build 는 이미지를 tar 아티팩트로 넘기기만 하고 레지스트리에 쓰지 않으며,
  # push 가 받아서 GHCR 에 올린 뒤 아티팩트를 바로 지운다 (보존 1일은 push 가 실패해 지우지 못했을 때의 상한).
  build:
    name: Build ${{ matrix.app }}
    needs: test
    # PR 에서는 테스트만 돌리고 도커 빌드는 하지 않는다
    if: github.event_name != 'pull_request' && needs.test.outputs.apps != '[]'
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.test.outputs.apps) }}

    steps:
      - uses: actions/checkout@v7

      # NEXT_PUBLIC_BASE_URL 은 번들에 인라인되고 없으면 OAuth 콜백이 localhost 로 가므로 먼저 막는다.
      # NEXT_PUBLIC_CDN_URL 은 코드가 비어 있어도 처리하므로(이미지 프록시 404, URL 변환 생략) 선택이다.
      - name: Check build variables
        if: matrix.app == 'web'
        env:
          NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL }}
        run: |
          if [ -z "$NEXT_PUBLIC_BASE_URL" ]; then
            echo "::error::Repository variable NEXT_PUBLIC_BASE_URL is not set (Settings > Secrets and variables > Actions > Variables)"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      # 태그는 push 잡에서도 같은 입력으로 다시 계산한다 (git 컨텍스트만 쓰므로 결과가 같다).
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/suufr-${{ matrix.app }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # 레지스트리에 쓰지 않고 docker load 가능한 tar 로 내보낸다. 빌드 캐시(gha)는 그대로 쓴다.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          outputs: type=docker,dest=${{ runner.temp }}/suufr-${{ matrix.app }}.tar
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
          # web 전용 (api Dockerfile 은 선언하지 않은 ARG 라 무시된다)
          build-args: |
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_CDN_URL=${{ vars.NEXT_PUBLIC_CDN_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.app }}
          path: ${{ runner.temp }}/suufr-${{ matrix.app }}.tar
          retention-days: 1
          compression-level: 0 # 이미지 레이어는 이미 압축돼 있어 재압축은 시간만 쓴다
          if-no-files-found: error

  push:
    name: Push ${{ matrix.app }}
    needs: [test, build]
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write
      actions: write # 아티팩트 삭제
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.test.outputs.apps) }}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: image-${{ matrix.app }}
          path: ${{ runner.temp }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/suufr-${{ matrix.app }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # tar 에는 build 잡이 붙인 태그가 들어 있다. 같은 태그를 다시 계산해 그것만 푸시한다.
      - name: Push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          docker load -i "$RUNNER_TEMP/suufr-${{ matrix.app }}.tar"
          for tag in $TAGS; do
            docker push "$tag"
          done

      # 푸시가 끝난 이미지 tar 를 Actions 에 남기지 않는다. 삭제가 실패해도 보존 1일로 정리되므로 배포를 막지 않는다.
      - name: Delete image artifact
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "image-${{ matrix.app }}") | .id' \
          | while read -r id; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" && echo "deleted artifact $id"
            done

  deploy:
    name: Deploy
    needs: [test, push]
    runs-on: ubuntu-26.04-arm
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      IMAGE_TAG: ${{ needs.push.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      # 이미지 태그 PATCH + 배포 큐 등록은 .github/scripts/coolify-deploy.sh, 완료 대기는 coolify-wait.sh 가 맡는다.
      # 시크릿: COOLIFY_URL(예: https://app.coolify.io, 끝 슬래시 없음), COOLIFY_TOKEN(Keys & Tokens, read+write+deploy 권한.
      #         read 가 없으면 상태 조회가 403), COOLIFY_APP_UUID_API / COOLIFY_APP_UUID_WEB(각 리소스 UUID). 비어 있으면 건너뛴다.
      # 롤백은 이전 sha 태그로 같은 절차를 반복하면 된다.
      - name: Deploy api
        id: api
        env:
          APP_UUID: ${{ secrets.COOLIFY_APP_UUID_API }}
        if: contains(fromJSON(needs.test.outputs.apps), 'api') && env.COOLIFY_URL != '' && env.COOLIFY_TOKEN != '' && env.APP_UUID != ''
        run: .github/scripts/coolify-deploy.sh

      - name: Deploy web
        id: web
        env:
          APP_UUID: ${{ secrets.COOLIFY_APP_UUID_WEB }}
        if: contains(fromJSON(needs.test.outputs.apps), 'web') && env.COOLIFY_URL != '' && env.COOLIFY_TOKEN != '' && env.APP_UUID != ''
        run: .github/scripts/coolify-deploy.sh

      # Coolify 의 /deploy 는 큐 등록만 하고 200 을 돌려주므로, deployment_uuid 로 finished/failed 를 확인해야 실제 결과를 안다.
      # Coolify UI 헬스체크가 켜져 있으면 finished 는 헬스체크 통과까지, 꺼져 있으면 컨테이너 기동까지를 뜻한다.
      - name: Wait for Coolify
        if: steps.api.outputs.deployment_uuid != '' || steps.web.outputs.deployment_uuid != ''
        timeout-minutes: 15
        env:
          DEPLOYMENTS: api=${{ steps.api.outputs.deployment_uuid }} web=${{ steps.web.outputs.deployment_uuid }}
        run: .github/scripts/coolify-wait.sh
