name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-26.04
    outputs:
      apps: ${{ steps.affected.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          # turbo --affected 가 base 커밋(github.event.before)까지 diff 할 수 있어야 한다
          fetch-depth: 0
      # pnpm 버전은 루트 package.json 의 packageManager 가 결정한다 (version 입력을 주면 충돌로 실패)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      # web 테스트가 api 소스를 import 하므로 필터 없이 전체 설치한다
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api prisma:generate
      - run: pnpm --filter api test:run
      - run: pnpm --filter web test:run

      # 빌드 대상 선정: turbo 의존성 그래프로 base..HEAD 사이에 영향받은 패키지만 고른다.
      # - apps/*, packages/* 변경은 그래프를 따라 전파된다 (packages/* 가 바뀌면 web/api 둘 다)
      # - pnpm-lock.yaml 은 의미 단위로 비교된다 (실제 의존성 버전이 바뀐 패키지만)
      # - 루트 파일은 turbo.json 의 globalDependencies 가 결정한다
      # - base 를 찾지 못하면(새 브랜치, force push) turbo 가 경고 후 전체를 반환한다
      # - 수동 실행은 항상 둘 다 빌드한다
      # PR 에서는 테스트만 한다 (github.event.before 가 없어 affected 계산도 건너뛴다)
      - name: Detect affected apps
        id: affected
        if: github.event_name != 'pull_request'
        env:
          TURBO_SCM_BASE: ${{ github.event.before }}
          TURBO_SCM_HEAD: ${{ github.sha }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$MANUAL" = "true" ]; then
            apps='["web","api"]'
          else
            apps=$(pnpm exec turbo run build --affected --dry-run=json | node -e '
              const raw = require("fs").readFileSync(0, "utf8");
              const json = JSON.parse(raw.slice(raw.indexOf("{")));
              const affected = new Set(json.packages);
              process.stdout.write(JSON.stringify(["web", "api"].filter(a => affected.has(a))));
            ')
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "build targets: $apps"

  build:
    name: Build ${{ matrix.app }}
    needs: test
    if: github.event_name != 'pull_request' && needs.test.outputs.apps != '[]'
    # Coolify 서버가 ARM 이라 arm64 네이티브 러너로 빌드한다 (공개 저장소는 무료)
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.test.outputs.apps) }}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      # NEXT_PUBLIC_BASE_URL 은 번들에 인라인되고 없으면 OAuth 콜백이 localhost 로 가므로 먼저 막는다.
      # NEXT_PUBLIC_CDN_URL 은 코드가 비어 있어도 처리하므로(이미지 프록시 404, URL 변환 생략) 선택이다.
      - name: Check build variables
        if: matrix.app == 'web'
        env:
          NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL }}
        run: |
          if [ -z "$NEXT_PUBLIC_BASE_URL" ]; then
            echo "::error::Repository variable NEXT_PUBLIC_BASE_URL is not set (Settings > Secrets and variables > Actions > Variables)"
            exit 1
          fi

      - name: Image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/suufr-${{ matrix.app }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
          # web 전용 (api Dockerfile 은 선언하지 않은 ARG 라 무시된다)
          build-args: |
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_CDN_URL=${{ vars.NEXT_PUBLIC_CDN_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}

  deploy:
    name: Deploy
    needs: [test, build]
    runs-on: ubuntu-26.04
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      IMAGE_TAG: ${{ needs.build.outputs.tag }}
    steps:
      # latest 태그 + deploy 웹훅만으로는 Coolify 가 새 이미지를 pull 하지 않을 수 있다(coolify#5318).
      # 그래서 리소스의 이미지 태그를 불변 태그(sha-xxxxxxx)로 PATCH 한 뒤 배포를 트리거한다.
      # 롤백은 이전 sha 태그로 같은 절차를 반복하면 된다.
      # 시크릿: COOLIFY_URL(예: https://coolify.example.com), COOLIFY_TOKEN(Keys & Tokens, write+deploy 권한),
      #         COOLIFY_APP_UUID_API / COOLIFY_APP_UUID_WEB(각 리소스 UUID). 비어 있으면 건너뛴다.
      - name: Deploy api
        env:
          APP_UUID: ${{ secrets.COOLIFY_APP_UUID_API }}
        if: contains(fromJSON(needs.test.outputs.apps), 'api') && env.COOLIFY_URL != '' && env.COOLIFY_TOKEN != '' && env.APP_UUID != ''
        run: |
          curl --fail-with-body -sS -X PATCH "$COOLIFY_URL/api/v1/applications/$APP_UUID" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" -H "Content-Type: application/json" \
            -d "{\"docker_registry_image_tag\":\"$IMAGE_TAG\"}"
          curl --fail-with-body -sS -X GET "$COOLIFY_URL/api/v1/deploy?uuid=$APP_UUID&force=false" \
            -H "Authorization: Bearer $COOLIFY_TOKEN"

      - name: Deploy web
        env:
          APP_UUID: ${{ secrets.COOLIFY_APP_UUID_WEB }}
        if: contains(fromJSON(needs.test.outputs.apps), 'web') && env.COOLIFY_URL != '' && env.COOLIFY_TOKEN != '' && env.APP_UUID != ''
        run: |
          curl --fail-with-body -sS -X PATCH "$COOLIFY_URL/api/v1/applications/$APP_UUID" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" -H "Content-Type: application/json" \
            -d "{\"docker_registry_image_tag\":\"$IMAGE_TAG\"}"
          curl --fail-with-body -sS -X GET "$COOLIFY_URL/api/v1/deploy?uuid=$APP_UUID&force=false" \
            -H "Authorization: Bearer $COOLIFY_TOKEN"
